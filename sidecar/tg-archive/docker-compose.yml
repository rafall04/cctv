services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: tg-archive-api
    restart: unless-stopped
    # /opt/tg-archive/.env — also what compose interpolates ${...} from
    env_file: .env
    entrypoint: ["telegram-bot-api"]
    command:
      - "--local"
      - "--api-id=${TELEGRAM_API_ID}"
      - "--api-hash=${TELEGRAM_API_HASH}"
      - "--http-port=8092"
      - "--dir=/var/lib/telegram-bot-api"
      - "--temp-dir=/tmp/telegram-bot-api"
      - "--http-ip-address=0.0.0.0"
      - "--verbosity=1"
    ports:
      # bind loopback only — never expose the bot token surface to the LAN
      - "127.0.0.1:8092:8092"
    volumes:
      # A HOST bind, not a named volume. When a segment's local recording has been pruned, the
      # server re-downloads it from Telegram into this directory (verified on prod: a 120 MB file,
      # far past the cloud API's 20 MB getFile ceiling). getFile then returns a path inside the
      # CONTAINER — so the backend, which runs on the host, can only read it if the same path
      # resolves there too. A named volume left it invisible and every playback failed.
      - /var/lib/telegram-bot-api:/var/lib/telegram-bot-api
      # recordings mounted READ-ONLY at the SAME absolute path the app uses,
      # so --local file paths resolve identically inside the container.
      - /var/www/rafnet-cctv/recordings:/var/www/rafnet-cctv/recordings:ro
    tmpfs:
      - /tmp/telegram-bot-api:size=512m
    # keep the archiver from starving live streaming / recording ffmpeg
    cpus: "1.0"
    mem_limit: 1g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
