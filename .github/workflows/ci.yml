name: CI

# Lightweight gate so the anti-"penumpukan" guardrails (file-size ratchet, layering & data-safety
# guards in __tests__/guardrails.test.js) + the full suites run on every push/PR — not just locally.
# Does NOT deploy (deploy stays on safe-deploy.sh + PM2).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (test + guardrails)
    runs-on: ubuntu-latest
    env:
      # Production runs in WIB, and parts of the suite assert wall-clock SQL strings
      # (viewer-session history stores local-time values BY DESIGN — see the timestamp
      # standard in SYSTEM_MAP.md). Pinning the runner timezone makes CI match the
      # deployment reality; on the default UTC runner those assertions are meaningless.
      TZ: Asia/Jakarta
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches production. The box moved to Node 22 LTS on 2026-08-03; Node 20 hit
          # end-of-life on 2026-04-30 and no longer receives security patches, so a green
          # run on 20 says less about the deployment every week.
          node-version: '22'
      # `npm ci`, not `npm install` — backend/package-lock.json is committed as of
      # 2026-08-03. While it was ignored, every run re-resolved the whole tree, so a green
      # run guaranteed nothing about the next; it is also what pins the native modules
      # (better-sqlite3, bcrypt) to the versions the suite actually verified.
      - run: npm ci
      # The suite expects a real SQLite schema at data/cctv.db (dev machines carry one;
      # CI starts empty — this was why 18 backend test files failed with "no such table"
      # on every run since the workflow was created). setup-db is non-interactive.
      - run: npm run setup-db
      - run: npm run migrate
      - run: npm test

  frontend:
    name: Frontend (lint + test + guardrails)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # `npm ci`, not `npm install`: the lockfile is committed for exactly this reason. With it
      # ignored, every run re-resolved every dependency, so a green run said nothing about the next.
      - run: npm ci
      - run: npm run lint
      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/frontend-test.log
      # Job logs need an authenticated session to read; the run summary does not. Putting the tail
      # of the failure here makes it readable (and screenshottable) by whoever hits it.
      - name: Surface the failure in the run summary
        if: failure()
        run: |
          {
            echo '### Frontend (lint + test) failure'
            echo '```'
            tail -150 /tmp/frontend-test.log 2>/dev/null || echo 'No test log — it failed before the tests ran (npm ci or lint).'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    # Real-browser overflow smoke (e2e/overflow.spec.js): asserts no public page can
    # scroll sideways on a phone viewport — the layout class jsdom can never catch
    # (2026-07 mobile zoom-out incident). API mocked, external hosts blocked, so this
    # cannot flake on network and never touches production.
    name: Frontend e2e (mobile overflow smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/e2e-build.log
      - run: npx playwright install --with-deps chromium
      - name: Overflow smoke
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee /tmp/e2e-test.log
      # Same reasoning as the frontend job: the run summary is readable without a session.
      - name: Surface the failure in the run summary
        if: failure()
        run: |
          {
            echo '### e2e (mobile overflow smoke) failure'
            echo '#### build'
            echo '```'
            tail -60 /tmp/e2e-build.log 2>/dev/null || echo 'No build log — it failed at npm ci.'
            echo '```'
            echo '#### test'
            echo '```'
            tail -120 /tmp/e2e-test.log 2>/dev/null || echo 'No test log — it failed before the tests ran.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
