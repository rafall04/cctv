      minimum-scale=1.0 is the decisive guard against the "whole page shrinks into a
      narrow column" bug. In-app WebViews (Telegram, MIUI, …) fit their initial zoom
      to the WIDEST content on the page, so a single wide element - typically a
      third-party ad iframe with a fixed pixel width - zooms the entire page out.
      Forbidding scale < 1 makes that mechanically impossible; the overflow-x guards
      in index.css then keep any such element clipped instead of pannable.
      Deliberately NO maximum-scale / user-scalable=no: pinch-zoom IN stays available.
    -->

    <script>
      /*
       * Early public-API prefetch. The landing's critical GETs are fired here — during HTML
       * parsing, before the JS bundle has even downloaded — so the origin round-trip overlaps
       * the bundle fetch+eval instead of queuing behind React boot. Services pick up the parsed
       * JSON promises through utils/earlyPrefetch.js (consume-once); background refreshes always
       * hit the network normally. All endpoints are public GETs the page would call anyway.
       * Skipped on /admin and /my (which need none of this); on /area/* the per-area camera
       * feed replaces the global list.
       */
      (function () {
        var path = window.location.pathname;
        if (path.indexOf('/admin') === 0 || path.indexOf('/my') === 0) return;
        var getJson = function (url) {
          return fetch(url, { headers: { Accept: 'application/json' }, credentials: 'same-origin' })
            .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)); });
        };
        var store = {};
        var add = function (key, url) {
          var p = getJson(url);
          // Mark the promise handled so an unclaimed failure never logs an unhandled rejection;
          // a consuming service still sees the rejection when it awaits the same promise.
          p.catch(function () {});
          store[key] = p;
        };
        add('config', '/api/config/public');
        add('branding', '/api/branding/public');
        add('landingSettings', '/api/settings/landing-page');
        add('publicAds', '/api/settings/public-ads');
        add('saweria', '/api/saweria/config');
        add('sponsors', '/api/sponsors/active');
        add('discovery', '/api/public/discovery?limit=6');
        add('timezone', '/api/settings/timezone');
        if (path === '/' || path === '') {
          add('cameras', '/api/cameras/active?summary=1');
          add('areas', '/api/areas/public');
          if (/[?&]view=map/.test(window.location.search)) {
            add('mapCenter', '/api/settings/map-center');
          }
        }
        var areaMatch = path.match(/^\/area\/([^/?#]+)/);
        if (areaMatch) {
          add('areaCameras:' + areaMatch[1], '/api/public/areas/' + areaMatch[1] + '/cameras');
        }
        window.__RAFNET_PREFETCH__ = store;
      })();
    </script>
    <script>
      /*
       * Pick the right app BEFORE the browser decides what is installable.
       * `beforeinstallprompt` fires once per page load and binds to whatever manifest is linked at
       * that moment — which can be well before React mounts. Without this, loading /admin directly
       * captured an install event for the PUBLIC app, and the admin toast would then have installed
       * the wrong one. React keeps this in sync afterwards for client-side navigation.
       * Inline + synchronous on purpose: any deferral reintroduces the race. Placed AFTER the two
       * tags it edits, because a parser-blocking script cannot see markup that follows it.
       */
      (function () {
        if (location.pathname.indexOf('/admin') === 0) {
          var link = document.querySelector('link[rel="manifest"]');
          if (link) link.setAttribute('href', '/admin.webmanifest?v=1');
          var theme = document.querySelector('meta[name="theme-color"]');
          if (theme) theme.setAttribute('content', '#b45309');
        }

        /*
         * Capture `beforeinstallprompt` HERE, not in React.
         * It fires exactly once per page load, and a listener that is not attached yet simply
         * misses it — forever. React attaches its listener from a useEffect, which on /admin runs
         * only after the lazy admin chunks have loaded, a far longer window than on the public
         * landing. That is why the admin toast could never appear no matter how often the page was
         * refreshed. Stashing it on `window` lets React pick it up whenever it does mount.
         */
        window.__deferredInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', function (event) {
          event.preventDefault();
          window.__deferredInstallPrompt = {
            event: event,
            manifest: (document.querySelector('link[rel="manifest"]') || {}).getAttribute
              ? document.querySelector('link[rel="manifest"]').getAttribute('href')
              : '',
          };
          window.dispatchEvent(new Event('rafnet:installprompt'));
        });
      })();
    </script>

    <!--
      Dynamic Meta Tags Configuration.

      The ?v= is load-bearing. This file is NOT content-hashed by Vite (it is copied from
      public/ verbatim), yet the edge serves it with `Cache-Control: immutable, max-age=1y`
      like a hashed asset — so an edited meta-config.js sat unseen at the CDN for 30 days
      while the origin had the new copy. index.html itself is never edge-cached, so bumping
      this number is what actually ships a change. BUMP IT whenever meta-config.js changes.
    -->
    <script defer src="/meta-config.js?v=5"></script>

  <body>
    <div id="root">
      <!--
        Pre-React boot shell. React's first root.render() clears everything inside
        #root, so there is no hydration concern. Purposes: (1) no blank dark page
        during bundle eval — the compressed heights below approximate the simple
        landing chrome (the whole shell is replaced at once on mount, so the swap
        stays a single layout change); (2) the aspect-ratio box hosts #boot-lcp-img,
        whose src the prefetch bootstrap fills with the SAME versioned thumbnail URL
        the first grid card will render — the LCP image starts downloading ~1 RTT
        after HTML instead of after JS boot. The <img> stays hidden until a real src
        is set, and hides itself again on error.

        The img box must START inside the initial viewport (≈500px here): an LCP
        candidate only counts when it actually paints, and below-fold content never
        paints. An earlier full-height replica put the box at ~670px — below the
        640-732px viewports of most mobile audits — so the bytes loaded but nothing
        ever rendered.
      -->
      <div id="boot-shell" style="background:#08090b;min-height:100vh" aria-hidden="true">
        <div style="height:56px;background:#0b0d0f;border-bottom:1px solid #1c2024"></div>
        <div style="max-width:1152px;margin:0 auto;padding:12px 16px">
          <div style="height:96px;border-radius:12px;background:#101316;border:1px solid #1c2024"></div>
          <div style="height:120px;border-radius:12px;background:#101316;border:1px solid #1c2024;margin-top:12px"></div>
          <div style="height:88px;border-radius:12px;background:#101316;border:1px solid #1c2024;margin-top:12px"></div>
          <div style="height:64px;border-radius:12px;background:#101316;border:1px solid #1c2024;margin-top:12px"></div>
          <div id="boot-lcp-slot" style="position:relative;aspect-ratio:16/9;max-width:380px;border-radius:12px;overflow:hidden;background:#15181b;margin-top:16px">
            <!--
              nginx SSI: the backend answers this subrequest with the real first-card
              <img> markup (src already resolved), so the thumbnail fetch starts
              with the HTML — not after the cameras JSON. If the backend is down or
              answers empty, nginx inserts nothing harmful and the script below
              fills #boot-lcp-slot itself once the prefetch promises resolve.
            -->
            <!--# include virtual="/api/public/lcp-card" wait="yes" -->
          </div>
        </div>
      </div>
    </div>
    <script>
      /*
       * LCP injection — MUST live after the boot-shell markup. The same code used
       * to run inside the <head> bootstrap, where a fast API response could resolve
       * before the parser reached <body>: getElementById returned null, so the img
       * never got a src (only the new Image() prewarm fired — the 4 thumbnail
       * requests we saw were those, not the boot img). Here the element is
       * guaranteed parsed; the promises are read from __RAFNET_PREFETCH__.
       *
       * Ordering replicates gridAreaScopedCameras for the default state (no search,
       * area 'all', tab 'all'): flagged-area heads first — online → name inside
       * each head — else raw API order. This replaced a discovery-based prewarm
       * that warmed live_now/top_cameras thumbs: those strips render no <img> and
       * discovery ordering (viewer_count DESC) is not grid ordering.
       */
      (function () {
        var store = window.__RAFNET_PREFETCH__;
        if (!store || !store.cameras) return;
        Promise.all([store.cameras, store.areas]).then(function (res) {
          var camJson = res[0] || {};
          var areaJson = res[1] || {};
          var cameras = Array.isArray(camJson) ? camJson : (camJson.data || []);
          var areasArr = Array.isArray(areaJson) ? areaJson : (areaJson.data || []);
          var flagged = {};
          areasArr.forEach(function (a) {
            if (a && a.name && (a.show_on_grid_default === 1 || a.show_on_grid_default === true)) flagged[a.name] = true;
          });
          var firstArea = null, head = [];
          if (Object.keys(flagged).length) {
            var groups = {};
            for (var i = 0; i < cameras.length; i++) {
              var c = cameras[i];
              if (!c || !c.area_name || !flagged[c.area_name]) continue;
              if (!groups[c.area_name]) { groups[c.area_name] = []; if (!firstArea) firstArea = c.area_name; }
              groups[c.area_name].push(c);
            }
            if (firstArea) {
              head = groups[firstArea].slice().sort(function (l, r) {
                var lo = (l.is_online === 1 || l.is_online === true) ? 1 : 0;
                var ro = (r.is_online === 1 || r.is_online === true) ? 1 : 0;
                if (lo !== ro) return ro - lo;
                return (l.name || '').localeCompare(r.name || '');
              });
            }
          }
          var ordered = head.concat(cameras);
          var seen = {};
          var warmed = 0;
          for (var j = 0; j < ordered.length && warmed < 4; j++) {
            var cam = ordered[j];
            if (!cam || seen[cam.id]) continue;
            seen[cam.id] = true;
            var tpath = cam.external_snapshot_url || cam.thumbnail_path;
            if (!tpath) continue;
            var url = tpath;
            if (cam.thumbnail_updated_at && tpath.indexOf('/api/thumbnails/') === 0) {
              url += (tpath.indexOf('?') >= 0 ? '&' : '?') + 'v=' + encodeURIComponent(cam.thumbnail_updated_at);
            }
            warmed++;
            if (warmed === 1) {
              var lcp = document.getElementById('boot-lcp-img');
              if (!lcp) {
                // SSI emitted nothing (backend down / empty pick) — create the img ourselves.
                var slot = document.getElementById('boot-lcp-slot');
                if (slot) {
                  lcp = document.createElement('img');
                  lcp.id = 'boot-lcp-img';
                  lcp.setAttribute('fetchpriority', 'high');
                  lcp.setAttribute('decoding', 'async');
                  lcp.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover';
                  slot.appendChild(lcp);
                }
              }
              if (lcp && !lcp.getAttribute('src')) {
                // SSI already resolved a src (or inlined the bytes) — don't disturb it.
                lcp.onerror = function () { lcp.style.display = 'none'; };
                lcp.src = url;
                lcp.alt = (cam.name || 'CCTV') + ' preview';
              } else if (lcp) {
                lcp.onerror = function () { lcp.style.display = 'none'; };
              }
            }
            var pi = new Image();
            pi.src = url;
          }
        }).catch(function () {});
      })();
    </script>
