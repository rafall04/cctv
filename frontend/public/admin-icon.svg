<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="adminGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b45309;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Amber on purpose: the public app is sky blue, and two identical icons on a
       home screen are worse than one. Same camera silhouette = same product. -->
  <rect width="100" height="100" rx="20" fill="url(#adminGrad)"/>
  <g fill="white">
    <rect x="20" y="30" width="40" height="28" rx="4"/>
    <polygon points="65,36 80,26 80,62 65,52"/>
  </g>
  <!-- Sliders = control panel. This is the part that reads as ADMIN. -->
  <g>
    <rect x="20" y="70" width="60" height="5" rx="2.5" fill="white" opacity="0.8"/>
    <circle cx="40.4" cy="72.5" r="4" fill="#78350f"/>
    <rect x="20" y="79" width="60" height="5" rx="2.5" fill="white" opacity="0.8"/>
    <circle cx="56" cy="81.5" r="4" fill="#78350f"/>
    <rect x="20" y="88" width="60" height="5" rx="2.5" fill="white" opacity="0.8"/>
    <circle cx="47.6" cy="90.5" r="4" fill="#78350f"/>
  </g>
</svg>
